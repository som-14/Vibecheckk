# Plain-English description: Multi-container Docker Compose configuration for PostgreSQL, Redis, FastAPI Backend, Celery Worker, and Next.js Frontend.

version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vibecheck_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-vibecheck_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./db/triggers.sql:/docker-entrypoint-initdb.d/03_triggers.sql:ro
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/04_procedures.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/05_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vibecheck_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vibecheck_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-vibecheck_db}
      REDIS_URL: redis://redis:6379/0
      JWT_PRIVATE_KEY_PATH: /app/jwt_rs256.key
      JWT_PUBLIC_KEY_PATH: /app/jwt_rs256.key.pub
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./jwt_rs256.key:/app/jwt_rs256.key:ro
      - ./jwt_rs256.key.pub:/app/jwt_rs256.key.pub:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: vibecheck_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-vibecheck_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/storage:/app/backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vibecheck_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
